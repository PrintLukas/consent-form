services:
  web:
    build:
      context: .
      target: runner
    # host:container — the app always listens on 3100 inside the container
    # (see Dockerfile's PORT/EXPOSE); only the host-side port is ours to pick.
    ports:
      - "3100:3100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3100/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s